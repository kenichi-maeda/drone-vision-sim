version: 1.0
frames:
  # Fields supported on each frame: relative_to, unit, pose, twist
  map_0:
    relative_to: ~
    pose:
      x: 0.0
      y: 0.0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
  map_0/vehicle_0:
    relative_to: ~
    pose:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      # Preserve the original vehicle heading; navigation must search visually.
      yaw: 1.57079632679
  # Overhead shot. Body +X is the camera axis. Yaw 0 looks east, and a
  # positive pitch about Y tips that axis down. From (-3.8, 0.3, 3.6) the
  # axis meets the ground at the spawn, with the 1.15 m ring inside the frame.
  map_0/overhead_0:
    relative_to: ~
    pose:
      x: -3.8
      y: 0.3
      z: 3.6
      roll: 0.0
      pitch: 0.75
      yaw: 0.0
  # The vehicle faces +Y. The yellow duckie and the red stop sign stay
  # close enough for YOLOv8n to score them. Ten colored bots stand on a
  # ring around the spawn so a hover turn can see each one. The plain
  # grey bot is farther ahead and is not a flight target.
  map_0/duckie_target:
    relative_to: ~
    pose:
      x: 0.22
      y: 0.48
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 1.57079632679
  map_0/sign_stop_front:
