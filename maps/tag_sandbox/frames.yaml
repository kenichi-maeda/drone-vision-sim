version: 1.0
frames:
  # Fields supported on each frame: relative_to, unit, pose, twist
  map_0:
    relative_to: ~
    pose:
      x: 0.0
      y: 0.0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
  map_0/vehicle_0:
    relative_to: ~
    pose:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      # Preserve the original vehicle heading; navigation must search visually.
      yaw: 1.57079632679
  # Stop sign restored 2026-11-16 at its original, visually approved pose as a
  # second, red identification target (YOLO: stop_sign). The duckie (yellow,
  # YOLO: sports_ball) stays the flight target, on the opposite side of spawn.
  # To remove it again, delete this frame and the traffic_signs.yaml entry.
  map_0/sign_stop_north:
    relative_to: ~
    pose:
      x: 0.75
      y: 0.75
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 1.04719755120
  # Keep the Duckie visual test prop; the COCO bird model did not recognize it.
  # Test move (2026-11-10): original duckie pose was x=-0.35, y=0.85, z=0, yaw=1.5708
  # (saved in frames_baseline_2026-11-10_duckie_-0.35_0.85.yaml).
  map_0/duckie_target:
    relative_to: ~
    pose:
      x: -0.7
      y: -0.7
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 1.57079632679
  # Keep the landing marker off the front-camera test line; use it later for
  # the separate downward-camera landing experiment.
  map_0/groundtag_301:
    relative_to: ~
    pose:
      x: 1.5
      y: 0.0
      z: 0.001
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
