version: 1.0
frames:
  # Fields supported on each frame: relative_to, unit, pose, twist
  map_0:
    relative_to: ~
    pose:
      x: 0.0
      y: 0.0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
  map_0/vehicle_0:
    relative_to: ~
    pose:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      # Preserve the original vehicle heading; navigation must search visually.
      yaw: 1.57079632679
  # The vehicle faces +Y. Yellow duckie close and right, red stop sign left.
  # The 2026-11-10 poses are in the *_baseline_2026-11-10_*.yaml files.
  map_0/duckie_target:
    relative_to: ~
    pose:
      x: 0.10
      y: 0.38
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 1.57079632679
  map_0/sign_stop_front:
    relative_to: ~
    pose:
      x: -0.48
      y: 0.95
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 2.77
  # Keep the landing marker off the front-camera test line; use it later for
  # the separate downward-camera landing experiment.
  map_0/groundtag_301:
    relative_to: ~
    pose:
      x: 1.5
      y: 0.0
      z: 0.001
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
