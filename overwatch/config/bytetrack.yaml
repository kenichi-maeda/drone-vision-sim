# ByteTrack settings for OVERWATCH (Ultralytics tracker format).
# Thresholds sit a little below the Ultralytics defaults because YOLO-World
# scores on rendered props are moderate (about 0.3-0.7).
tracker_type: bytetrack
track_high_thresh: 0.2
track_low_thresh: 0.08
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
